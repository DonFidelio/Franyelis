<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#eafbf8"/><stop offset=".55" stop-color="#c9f0ec"/><stop offset="1" stop-color="#8bd9d5"/></linearGradient>
